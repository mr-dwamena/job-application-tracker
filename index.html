<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Application Tracker</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Portfolio Project</p>
        <h1>Job Application Tracker</h1>
        <p>Keep every opportunity and its current status in one place.</p>
      </header>
            <section aria-labelledby="add-application-heading">
        <h2 id="add-application-heading">Add an application</h2>
        <form id="application-form">
          <label for="company">Company</label>
          <input id="company" name="company" type="text" required />

          <label for="role">Role</label>
          <input id="role" name="role" type="text" required />

          <label for="status">Status</label>
          <select id="status" name="status" required>
            <option value="Applied">Applied</option>
            <option value="Interview">Interview</option>
            <option value="Offer">Offer</option>
            <option value="Rejected">Rejected</option>
          </select>

          <button type="submit">Add application</button>
        </form>
             
      </section>
       <section aria-labelledby="applications-heading">
        <div class="summary">
          <h2 id="applications-heading">Applications</h2>
          <p><span id="application-count">0</span> tracked</p>
        </div>
        <div id="applications-list" aria-live="polite"></div>
      </section>
    </main>
  </body>
</html>
